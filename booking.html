<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Craftsvilla Booking</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lilita+One&family=Nova+Slim&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <banner class="banner text-color">
      <div class="logo">CRAFTSVILLA</div>
      <div class="slogan">You do...YOU</div>
      <navbar class="navbar text-color">
        <button type="button" id="home-btn" class="btn">Home</button>
        <button type="button" id="gallery-btn" class="btn">Gallery</button>
        <button type="button" id="feedback-btn" class="btn">Feedback</button>
      </navbar>
    </banner>
    <div class="horizontal-frame">
      <div class="form-frame">
        <form id="booking-form" action="#" method="POST">
          <div class="form-group">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required />
          </div>

          <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-group">
            <label for="checkin-date">Check-in Date:</label>
            <input type="date" id="checkin-date" name="checkin-date" required />
          </div>

          <div class="form-group">
            <label for="checkout-date">Check-out Date:</label>
            <input
              type="date"
              id="checkout-date"
              name="checkout-date"
              required
            />
          </div>

          <div class="form-group">
            <label for="guests">Number of Guests:</label>
            <input
              type="number"
              id="guests"
              name="guests"
              min="1"
              value="1"
              required
            />
          </div>
          <button type="submit" class="submit">Book Now</button>
        </form>
      </div>
      <div class="selection-frame">
        <div class="choice-line">
          <label for="aquarell">
            <input type="checkbox" class="choice" value="499.00" />
            Weekly aquarell painting workshop: 499kr/month.
          </label>
        </div>
        <div class="choice-line">
          <label for="canvas">
            <input type="checkbox" class="choice" value="499.00" />
            Weekly canvas painting workshop: 499kr/month.
          </label>
        </div>
        <div class="choice-line">
          <label for="mosaic">
            <input type="checkbox" class="choice" value="599.00" />
            Weekly mosaic workshop: 599kr/month.
          </label>
        </div>
        <div class="choice-line">
          <label for="included">
            <input type="checkbox" class="choice" value="250.00" />
            Include tools and supplies: 250kr/month.
          </label>
        </div>
      </div>
    </div>
    <div class="total-container">
      <h3>Total monthly price:</h3>
      <div id="total-price"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
