<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Craftsvilla Gallery</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lilita+One&family=Nova+Slim&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <banner class="banner text-color">
      <div class="logo">CRAFTSVILLA</div>
      <div class="slogan">You do...YOU</div>
      <navbar class="navbar text-color">
        <button type="button" id="home-btn" class="btn">Home</button>
        <button type="button" id="booking-btn" class="btn">Booking</button>
        <button type="button" id="feedback-btn" class="btn">Feedback</button>
      </navbar>
    </banner>
    <div class="available-frame">
      <div class="examples">
        <h2>A few examples of previous workshops:</h2>
      </div>
      <div class="fan-gallery">
        <img
          src="images/aquarell-example.avif"
          alt="Aquarell Example"
          class="fan-image"
        />
        <img
          src="images/canvas-example.avif"
          alt="Canvas Example"
          class="fan-image"
        />
        <img
          src="images/mosaic-example.jpg"
          alt="Mosaic Example"
          class="fan-image"
        />
        <img
          src="images/workshop-painting.jpg"
          alt="Workshop Painting"
          class="fan-image"
        />
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
