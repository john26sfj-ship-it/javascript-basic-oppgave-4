<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Craftsvilla Home</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lilita+One&family=Nova+Slim&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="body-home">
    <banner class="banner text-color">
      <logo class="logo">CRAFTSVILLA</logo>
      <slogan class="slogan">You do...YOU</slogan>
      <navbar class="navbar text-color">
        <button type="button" id="booking-btn" class="btn">Booking</button>
        <button type="button" id="gallery-btn" class="btn">Gallery</button>
        <button type="button" id="feedback-btn" class="btn">Feedback</button>
      </navbar>
    </banner>
    <content class="content-frame">
      <textFrame class="join-us">
        <h2>Join us:</h2>
        <p class="intro">
          Here at Craftsvilla, we pride ourselves at focusing on the student,
          helping the budding artist within bloom in whichever field of art we
          offer. All courses led by recognized masters of their craft. So
          welcome, and...you do YOU.
        </p>
      </textFrame>
      <img src="images/workshop-painting.jpg" alt="" class="atelier" />
    </content>
    <script src="script.js"></script>
  </body>
</html>
